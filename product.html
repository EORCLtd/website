<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="technology.meta.title"></title>
  <meta name="description"
    content="" data-i18n-attr="content:technology.meta.description">
  <link rel="icon" href="img/cropped-EORC_logo_letter-270x270.png">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <link rel="alternate" type="text/markdown" href="product.md">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v5.css">
  <script src="js/i18n.js"></script>
</head>

<body class="v5">

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand">
        <span class="brand-mark"></span>
        <i18n-t data-i18n="nav.brand"></i18n-t>
      </a>
      <span class="nav-spacer"></span>
      <button class="nav-toggle" aria-label="" aria-expanded="false" data-i18n-attr="aria-label:nav.nav-toggle.aria-label">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="product.html" aria-current="page" data-i18n="nav.a-product"></a></li>
        <li><a href="about.html" data-i18n="nav.a-about"></a></li>
        <li><a href="contact.html" data-i18n="nav.a-contact"></a></li>
        <li><a href="contact.html" class="nav-cta" data-i18n="nav.nav-cta"></a></li>
      </ul>
    </nav>
  </header>

  <!-- Progress through the five steps; shown from step 01 until the closing CTA (js/main.js) -->
  <nav class="v5-stepnav" data-step-nav aria-label="" data-i18n-attr="aria-label:technology.page.stepnav.aria-label">
    <div class="v5-stepnav-inner">
      <a href="#step-1" data-step="step-1"><span class="v5-stepnav-num">01</span><span class="v5-stepnav-name" data-i18n="technology.page.stepnav-name"></span></a>
      <a href="#step-2" data-step="step-2"><span class="v5-stepnav-num">02</span><span class="v5-stepnav-name" data-i18n="technology.page.stepnav-name-2"></span></a>
      <a href="#step-3" data-step="step-3"><span class="v5-stepnav-num">03</span><span class="v5-stepnav-name" data-i18n="technology.page.stepnav-name-3"></span></a>
      <a href="#step-4" data-step="step-4"><span class="v5-stepnav-num">04</span><span class="v5-stepnav-name" data-i18n="technology.page.stepnav-name-4"></span></a>
      <a href="#step-5" data-step="step-5"><span class="v5-stepnav-num">05</span><span class="v5-stepnav-name" data-i18n="technology.page.stepnav-name-5"></span></a>
    </div>
  </nav>

  <main>
    <!-- Hero -->
    <section class="v5-page-hero v5-tech-hero">
      <img class="v5-photo" src="img/web/technology.jpg" alt="" decoding="async">
      <div class="v5-hero-shade" aria-hidden="true"></div>
      <div class="v5-page-hero-inner">
        <div class="v5-hero-kicker" data-i18n="technology.tech-hero.hero-kicker"></div>
        <h1 data-i18n-html="technology.tech-hero.h1"></h1>
        <p class="v5-page-lede" data-i18n="technology.tech-hero.page-lede"></p>
      </div>
    </section>

    <!-- From data to decision -->
    <section class="v5-path-section">
      <div class="v5-wrap v5-path">
        <div data-rv class="v5-eyebrow" data-i18n="technology.path-section.eyebrow"></div>
        <div data-rv data-rvd="60" class="v5-path-steps">
          <a href="#step-1"><span class="v5-path-head"><span class="v5-path-num">01</span><span
                class="v5-path-name" data-i18n="technology.path-section.path-name"></span></span><span class="v5-path-blurb" data-i18n="technology.path-section.path-blurb"></span></a>
          <a href="#step-2"><span class="v5-path-head"><span class="v5-path-num">02</span><span
                class="v5-path-name" data-i18n="technology.path-section.path-name-2"></span></span><span class="v5-path-blurb" data-i18n="technology.path-section.path-blurb-2"></span></a>
          <a href="#step-3"><span class="v5-path-head"><span class="v5-path-num">03</span><span
                class="v5-path-name" data-i18n="technology.path-section.path-name-3"></span></span><span class="v5-path-blurb" data-i18n="technology.path-section.path-blurb-3"></span></a>
          <a href="#step-4"><span class="v5-path-head"><span class="v5-path-num">04</span><span
                class="v5-path-name" data-i18n="technology.path-section.path-name-4"></span></span><span class="v5-path-blurb" data-i18n="technology.path-section.path-blurb-4"></span></a>
          <a href="#step-5"><span class="v5-path-head"><span class="v5-path-num">05</span><span
                class="v5-path-name" data-i18n="technology.path-section.path-name-5"></span></span><span class="v5-path-blurb" data-i18n="technology.path-section.path-blurb-5"></span></a>
        </div>
        <div data-rv data-rvd="120" class="v5-path-actions">
          <a href="#step-1" class="v5-btn v5-btn--dark v5-btn--lg" data-i18n="technology.path-section.btn"></a>
          <a href="contact.html?intent=demo" class="v5-btn v5-btn--outline v5-btn--lg" data-i18n="technology.path-section.btn-2"></a>
        </div>
      </div>
    </section>

    <!-- 01 Data analysis -->
    <section id="step-1" class="v5-step">
      <div class="v5-wrap v5-feature">
        <div data-rv class="v5-feature-copy">
          <div class="v5-eyebrow" data-i18n="technology.step-1.eyebrow"></div>
          <h2 class="v5-title v5-title--step" data-i18n="technology.step-1.title"></h2>
          <p data-i18n="technology.step-1.p"></p>
          <ul class="v5-feature-list">
            <li data-i18n="technology.step-1.li"></li>
            <li data-i18n="technology.step-1.li-2"></li>
            <li data-i18n="technology.step-1.li-3"></li>
          </ul>
          <a href="#step-2" class="v5-step-next" data-i18n="technology.step-1.step-next"></a>
        </div>
        <div data-rv data-rvd="120" class="v5-feature-media">
          <div data-fig="inputs" class="figure-panel-light">
            <div class="inputs-head">
              <span class="inputs-label" data-i18n="technology.step-1.inputs-label"></span>
              <span class="inputs-label muted" data-i18n="technology.step-1.inputs-label-2"></span>
            </div>
            <div class="input-row">
              <div>
                <div class="input-name" data-i18n="technology.step-1.input-name"></div>
                <div class="input-source" data-i18n="technology.step-1.input-source"></div>
              </div>
              <svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-hidden="true">
                <path data-spark="demand"></path>
              </svg>
              <span class="input-res" data-i18n="technology.step-1.input-res"></span>
            </div>
            <div class="input-row">
              <div>
                <div class="input-name" data-i18n="technology.step-1.input-name-2"></div>
                <div class="input-source" data-i18n="technology.step-1.input-source-2"></div>
              </div>
              <svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-hidden="true">
                <path data-spark="renewables"></path>
              </svg>
              <span class="input-res" data-i18n="technology.step-1.input-res-2"></span>
            </div>
            <div class="input-row">
              <div>
                <div class="input-name" data-i18n="technology.step-1.input-name-3"></div>
                <div class="input-source" data-i18n="technology.step-1.input-source-3"></div>
              </div>
              <svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-hidden="true">
                <path data-spark="prices"></path>
              </svg>
              <span class="input-res" data-i18n="technology.step-1.input-res-3"></span>
            </div>
            <div class="input-row">
              <div>
                <div class="input-name" data-i18n="technology.step-1.input-name-4"></div>
                <div class="input-source" data-i18n="technology.step-1.input-source-4"></div>
              </div>
              <svg viewBox="0 0 140 32" preserveAspectRatio="none" aria-hidden="true">
                <path data-spark="costs"></path>
              </svg>
              <span class="input-res" data-i18n="technology.step-1.input-res-4"></span>
            </div>
            <div class="figure-caption inputs-note" data-i18n="technology.step-1.figure-caption"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 02 Scenario generation -->
    <section id="step-2" class="v5-step">
      <div class="v5-wrap v5-feature v5-feature--reverse">
        <div data-rv data-rvd="120" class="v5-feature-media">
          <!-- Uncertainty across three decision timescales -->
          <div data-fig="horizon" class="figure-panel">
            <div class="seg" data-horizon-controls hidden>
              <button type="button" data-value="day" aria-pressed="true" data-i18n="technology.step-2.button"></button>
              <button type="button" data-value="decade" aria-pressed="false" data-i18n="technology.step-2.button-2"></button>
            </div>
            <svg class="figure-svg" viewBox="0 0 600 220" preserveAspectRatio="none" style="height:15.625rem;"
              aria-hidden="true">
              <line x1="0" y1="40" x2="600" y2="40" stroke="rgba(242,244,246,.07)"></line>
              <line x1="0" y1="110" x2="600" y2="110" stroke="rgba(242,244,246,.07)"></line>
              <line x1="0" y1="180" x2="600" y2="180" stroke="rgba(242,244,246,.07)"></line>
              <path data-horizon-band fill="oklch(0.78 0.14 170 / .1)"></path>
              <path data-horizon-area fill="oklch(0.78 0.14 170 / .1)"></path>
              <path data-horizon-path fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"
                vector-effect="non-scaling-stroke"></path>
            </svg>
            <div class="figure-foot">
              <div>
                <div class="horizon-title" data-horizon-title data-i18n="figures.horizon.day.title"></div>
                <div class="horizon-body" data-horizon-body data-i18n="figures.horizon.day.body"></div>
              </div>
              <div class="figure-caption" data-horizon-axis data-i18n="figures.horizon.day.axis"></div>
            </div>
          </div>
        </div>
        <div data-rv class="v5-feature-copy">
          <div class="v5-eyebrow" data-i18n="technology.step-2.eyebrow"></div>
          <h2 class="v5-title v5-title--step" data-i18n="technology.step-2.title"></h2>
          <p data-i18n="technology.step-2.p"></p>
          <ul class="v5-feature-list">
            <li data-i18n="technology.step-2.li"></li>
            <li data-i18n="technology.step-2.li-2"></li>
          </ul>
          <a href="#step-3" class="v5-step-next" data-i18n="technology.step-2.step-next"></a>
        </div>
      </div>
    </section>

    <!-- 03 Modelling -->
    <section id="step-3" class="v5-step">
      <div class="v5-wrap v5-feature">
        <div data-rv class="v5-feature-copy">
          <div class="v5-eyebrow" data-i18n="technology.step-3.eyebrow"></div>
          <h2 class="v5-title v5-title--step" data-i18n="technology.step-3.title"></h2>
          <p data-i18n="technology.step-3.p"></p>
          <ul class="v5-feature-list">
            <li data-i18n="technology.step-3.li"></li>
            <li data-i18n="technology.step-3.li-2"></li>
            <li data-i18n="technology.step-3.li-3"></li>
          </ul>
          <a href="#step-4" class="v5-step-next" data-i18n="technology.step-3.step-next"></a>
        </div>
        <div data-rv data-rvd="120" class="v5-feature-media">
          <!-- Pan-European network, filtered by energy carrier -->
          <div data-fig="network" class="figure-panel-dark on-dark">
            <div class="filter-row" data-net-controls hidden>
              <button type="button" data-value="all" aria-pressed="true" data-i18n="technology.step-3.button"></button>
              <button type="button" data-value="e" aria-pressed="false" data-i18n="technology.step-3.button-2"></button>
              <button type="button" data-value="h" aria-pressed="false" data-i18n="technology.step-3.button-3"></button>
              <button type="button" data-value="g" aria-pressed="false" data-i18n="technology.step-3.button-4"></button>
            </div>
            <svg class="figure-svg auto-h" viewBox="0 0 600 620" aria-hidden="true">
              <g data-net-links></g>
              <g data-net-flows></g>
              <g data-net-nodes></g>
            </svg>
            <div class="figure-foot">
              <div class="figure-caption" data-net-caption data-i18n="figures.carrier.all"></div>
              <div class="figure-caption" data-i18n="technology.step-3.figure-caption-2"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 04 Algorithms -->
    <section id="step-4" class="v5-step v5-step--band">
      <div class="v5-wrap v5-step-inner">
        <div class="v5-split-head">
          <div data-rv>
            <div class="v5-eyebrow" data-i18n="technology.step-4.eyebrow"></div>
            <h2 class="v5-title v5-title--step" data-i18n="technology.step-4.title"></h2>
          </div>
          <div data-rv data-rvd="90">
            <p class="v5-lede" data-i18n="technology.step-4.lede"></p>
            <div class="tag-row">
              <span data-i18n="technology.step-4.span"></span>
            </div>
          </div>
        </div>

        <!-- Benchmarks: bars grow from the axis when first scrolled to -->
        <div class="bench-grid">
          <div data-rv class="bench-card">
            <div class="bench-label" data-i18n="technology.step-4.bench-label"></div>
            <figure data-fig="bars" class="bars on-dark" style="--max:120;">
              <div class="bars-plot">
                <div class="bars-row">
                  <div class="bars-name" data-i18n="technology.step-4.bars-name"></div>
                  <div class="bars-track"><span class="bars-note" data-i18n="technology.step-4.bars-note"></span></div>
                </div>
                <div class="bars-row">
                  <div class="bars-name" data-i18n="technology.step-4.bars-name-2"></div>
                  <div class="bars-track">
                    <div class="bar-line" style="--i:0;"><span class="bar" style="--v:106;"><span class="bar-value" data-i18n="technology.step-4.bar-value"></span></span></div>
                  </div>
                </div>
                <div class="bars-row">
                  <div class="bars-name" data-i18n="technology.step-4.bars-name-3"></div>
                  <div class="bars-track">
                    <div class="bar-line" style="--i:1;"><span class="bar" style="--v:0.9;"></span><span
                        class="bar-value out" data-i18n="technology.step-4.bar-value-2"></span></div>
                  </div>
                </div>
              </div>
              <div class="bars-axis">
                <div class="bars-ticks" aria-hidden="true">
                  <span style="--at:0;">0</span><span class="minor" style="--at:0.25;">30</span><span
                    style="--at:0.5;">60</span><span class="minor" style="--at:0.75;">90</span><span
                    style="--at:1;">120</span>
                </div>
                <div class="bars-unit" data-i18n="technology.step-4.bars-unit"></div>
              </div>
              <figcaption class="bars-caption">
                <span class="bars-takeaway" data-i18n-html="technology.step-4.bars-takeaway"></span>
                <span class="bars-footnote" data-i18n="technology.step-4.bars-footnote"></span>
              </figcaption>
            </figure>
          </div>
          <div data-rv data-rvd="110" class="bench-card">
            <div class="bench-label" data-i18n="technology.step-4.bench-label-2"></div>
            <figure data-fig="bars" class="bars on-dark" style="--max:5000;">
              <div class="bars-legend">
                <span style="--swatch:var(--series-a);" data-i18n="technology.step-4.span-2"></span>
                <span style="--swatch:var(--series-b);" data-i18n="technology.step-4.span-3"></span>
              </div>
              <div class="bars-plot">
                <div class="bars-row">
                  <div class="bars-name" data-i18n="technology.step-4.bars-name-4"></div>
                  <div class="bars-track"><span class="bars-note" data-i18n="technology.step-4.bars-note-2"></span></div>
                </div>
                <div class="bars-row">
                  <div class="bars-name" data-i18n="technology.step-4.bars-name-5"></div>
                  <div class="bars-track">
                    <div class="bar-line" style="--i:0;"><span class="bar" style="--v:1000;"></span><span
                        class="bar-value out"><span class="sr-only" data-i18n="technology.step-4.sr-only"></span> <i18n-t data-i18n="technology.step-4.bar-value-3"></i18n-t></span></div>
                    <div class="bar-line" style="--i:1;"><span class="bar b" style="--v:4500;"><span
                          class="bar-value"><span class="sr-only" data-i18n="technology.step-4.sr-only-2"></span> <i18n-t data-i18n="technology.step-4.bar-value-4"></i18n-t></span></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="bars-axis">
                <div class="bars-ticks" aria-hidden="true">
                  <span style="--at:0;">0</span><span class="minor" style="--at:0.25;">1&nbsp;250</span><span
                    style="--at:0.5;">2&nbsp;500</span><span class="minor" style="--at:0.75;">3&nbsp;750</span><span
                    style="--at:1;">5&nbsp;000</span>
                </div>
                <div class="bars-unit" data-i18n="technology.step-4.bars-unit-2"></div>
              </div>
              <figcaption class="bars-caption">
                <span class="bars-takeaway" data-i18n-html="technology.step-4.bars-takeaway-2"></span>
              </figcaption>
            </figure>
          </div>
        </div>
        <a href="#step-5" class="v5-step-next" data-i18n="technology.step-4.step-next"></a>
      </div>
    </section>

    <!-- 05 Results -->
    <section id="step-5" class="v5-step">
      <div class="v5-wrap v5-step-inner">
        <div data-rv class="v5-eyebrow" data-i18n="technology.step-5.eyebrow"></div>
        <div data-rv data-rvd="80" class="v5-split-head">
          <h2 class="v5-title v5-title--step" data-i18n="technology.step-5.title"></h2>
          <p class="v5-lede" data-i18n="technology.step-5.lede"></p>
        </div>

        <div data-rv data-rvd="120" data-fig="fan" class="figure-panel-light fan-panel">
          <div class="fan-head">
            <span class="inputs-label" data-i18n="technology.step-5.inputs-label"></span>
            <span class="fan-legend">
              <span><i class="swatch-line"></i><i18n-t data-i18n="technology.step-5.span"></i18n-t></span>
              <span><i class="swatch-box strong"></i><i18n-t data-i18n="technology.step-5.span-2"></i18n-t></span>
              <span><i class="swatch-box"></i><i18n-t data-i18n="technology.step-5.span-3"></i18n-t></span>
              <span><i class="swatch-line dashed"></i><i18n-t data-i18n="technology.step-5.span-4"></i18n-t></span>
            </span>
          </div>
          <svg class="figure-svg" viewBox="0 0 600 220" preserveAspectRatio="none" style="height:16.25rem;"
            aria-hidden="true">
            <line x1="0" y1="40" x2="600" y2="40" stroke="rgba(22,25,29,.06)"></line>
            <line x1="0" y1="110" x2="600" y2="110" stroke="rgba(22,25,29,.06)"></line>
            <line x1="0" y1="180" x2="600" y2="180" stroke="rgba(22,25,29,.06)"></line>
            <path data-fan="outer" fill="oklch(0.78 0.14 170 / .15)"></path>
            <path data-fan="inner" fill="oklch(0.78 0.14 170 / .35)"></path>
            <path data-fan="forecast" fill="none" stroke="var(--forecast)" stroke-width="2" stroke-dasharray="7 6"
              vector-effect="non-scaling-stroke"></path>
            <path data-fan="median" fill="none" stroke="var(--accent-deep)" stroke-width="2.4" stroke-linejoin="round"
              vector-effect="non-scaling-stroke"></path>
          </svg>
          <div class="fan-axis"><span data-i18n="technology.step-5.span-5"></span><span data-i18n="technology.step-5.span-6"></span><span data-i18n="technology.step-5.span-7"></span></div>
        </div>

        <div data-rv data-rvd="160" class="output-grid">
          <div class="output">
            <span class="output-mark"></span>
            <h3 data-i18n="technology.step-5.h3"></h3>
            <p data-i18n="technology.step-5.p"></p>
          </div>
          <div class="output">
            <span class="output-mark"></span>
            <h3 data-i18n="technology.step-5.h3-2"></h3>
            <p data-i18n="technology.step-5.p-2"></p>
          </div>
          <div class="output">
            <span class="output-mark"></span>
            <h3 data-i18n="technology.step-5.h3-3"></h3>
            <p data-i18n="technology.step-5.p-3"></p>
          </div>
          <div class="output">
            <span class="output-mark"></span>
            <h3 data-i18n="technology.step-5.h3-4"></h3>
            <p data-i18n="technology.step-5.p-4"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- CTA + footer -->
    <section id="get-started" class="v5-closing v5-closing--center">
      <div class="v5-wrap">
        <div class="v5-closing-center">
          <div data-rv class="v5-hero-kicker" data-i18n="technology.get-started.hero-kicker"></div>
          <h2 data-rv data-rvd="60" data-i18n-html="technology.get-started.h2"></h2>
          <p data-rv data-rvd="120" data-i18n="technology.get-started.p"></p>
          <div data-rv data-rvd="180" class="v5-closing-actions">
            <a href="contact.html?intent=demo" class="v5-btn v5-btn--accent v5-btn--lg" data-i18n="technology.get-started.btn"></a>
            <a href="about.html" class="v5-btn v5-btn--ghost v5-btn--lg" data-i18n="technology.get-started.btn-2"></a>
          </div>
        </div>
        <footer class="site-footer">
          <div class="footer-brand">
            <span class="footer-mark"></span>
            <span class="copyright" data-i18n="footer.copyright"></span>
          </div>
