<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="about.meta.title"></title>
  <meta name="description"
    content="" data-i18n-attr="content:about.meta.description">
  <link rel="icon" href="img/cropped-EORC_logo_letter-270x270.png">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <link rel="alternate" type="text/markdown" href="about.md">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v5.css">
  <script src="js/i18n.js"></script>
</head>

<body class="v5">

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand">
        <span class="brand-mark"></span>
        <i18n-t data-i18n="nav.brand"></i18n-t>
      </a>
      <span class="nav-spacer"></span>
      <button class="nav-toggle" aria-label="" aria-expanded="false" data-i18n-attr="aria-label:nav.nav-toggle.aria-label">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="product.html" data-i18n="nav.a-product"></a></li>
        <li><a href="about.html" aria-current="page" data-i18n="nav.a-about"></a></li>
        <li><a href="contact.html" data-i18n="nav.a-contact"></a></li>
        <li><a href="contact.html" class="nav-cta" data-i18n="nav.nav-cta"></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- About hero -->
    <section class="v5-page-hero">
      <!-- TODO photo: Edinburgh / team at work (full-bleed) -->
      <div class="v5-photo" aria-hidden="true"></div>
      <div class="v5-hero-shade" aria-hidden="true"></div>
      <div class="v5-page-hero-inner">
        <div class="v5-hero-eyebrow" data-i18n="about.page-hero.hero-eyebrow"></div>
        <h1 data-i18n-html="about.page-hero.h1"></h1>
        <p class="v5-page-lede" data-i18n="about.page-hero.page-lede"></p>
        <a href="#team" class="v5-btn v5-btn--light" data-i18n="about.page-hero.btn"></a>
      </div>
    </section>

    <!-- Who we are -->
    <section class="v5-section v5-about-pillars">
      <div class="v5-wrap v5-pillars">
        <article data-rv class="v5-pillar">
          <h2 data-i18n="about.about-pillars.h2"></h2>
          <p data-i18n="about.about-pillars.p"></p>
        </article>
        <article data-rv data-rvd="90" class="v5-pillar">
          <h2 data-i18n="about.about-pillars.h2-2"></h2>
          <p data-i18n="about.about-pillars.p-2"></p>
        </article>
        <article data-rv data-rvd="180" class="v5-pillar">
          <h2 data-i18n="about.about-pillars.h2-3"></h2>
          <p data-i18n="about.about-pillars.p-3"></p>
        </article>
      </div>
    </section>

    <!-- Team -->
    <section id="team" class="v5-section v5-team">
      <div class="v5-wrap">
        <div class="v5-head">
          <div>
            <div data-rv class="v5-eyebrow" data-i18n="about.team.eyebrow"></div>
            <h2 data-rv data-rvd="80" class="v5-title" data-i18n="about.team.title"></h2>
          </div>
          <p data-rv data-rvd="140" class="v5-head-note" data-i18n="about.team.head-note"></p>
        </div>
        <div class="v5-team-grid">
          <article data-rv class="v5-member">
            <div class="v5-member-photo">
              <img src="img/HZ_ntnu_profile_photo.jpg" alt="" data-i18n-attr="alt:about.team.img.alt">
            </div>
            <div class="v5-member-body">
              <div>
                <h3 data-i18n="about.team.h3"></h3>
                <div class="v5-member-role" data-i18n="about.team.member-role"></div>
              </div>
              <p data-i18n="about.team.p"></p>
              <div class="v5-member-links">
                <a href="mailto:info@eorc.uk" class="v5-btn v5-btn--outline v5-btn--sm" data-i18n="about.team.btn"></a>
                <a href="https://www.linkedin.com/in/hongyu-zhang-0416/" target="_blank" rel="noopener"
                  class="v5-btn v5-btn--dark v5-btn--sm" data-i18n="about.team.btn-2"></a>
              </div>
            </div>
          </article>
          <article data-rv data-rvd="90" class="v5-member">
            <div class="v5-member-photo">
              <img src="img/TF_profile_photo.jpg" alt="" data-i18n-attr="alt:about.team.img.alt-2">
            </div>
            <div class="v5-member-body">
              <div>
                <h3 data-i18n="about.team.h3-2"></h3>
                <div class="v5-member-role" data-i18n="about.team.member-role-2"></div>
              </div>
              <p data-i18n="about.team.p-2"></p>
              <div class="v5-member-links">
                <a href="mailto:tf@eorc.uk" class="v5-btn v5-btn--outline v5-btn--sm" data-i18n="about.team.btn-3"></a>
                <a href="https://www.linkedin.com/in/tommaso-ferrario-383423200/" target="_blank" rel="noopener"
                  class="v5-btn v5-btn--dark v5-btn--sm" data-i18n="about.team.btn-4"></a>
              </div>
            </div>
          </article>
          <article data-rv data-rvd="180" class="v5-member">
            <div class="v5-member-photo">
              <img src="img/GS_square.jpg" alt="" data-i18n-attr="alt:about.team.img.alt-3">
            </div>
            <div class="v5-member-body">
              <div>
                <h3 data-i18n="about.team.h3-3"></h3>
                <div class="v5-member-role" data-i18n="about.team.member-role-3"></div>
              </div>
              <p data-i18n="about.team.p-3"></p>
              <div class="v5-member-links">
                <a href="mailto:gs@eorc.uk" class="v5-btn v5-btn--outline v5-btn--sm" data-i18n="about.team.btn-5"></a>
                <a href="https://www.linkedin.com/in/gabriele-sormani-0866962a3/" target="_blank" rel="noopener"
                  class="v5-btn v5-btn--dark v5-btn--sm" data-i18n="about.team.btn-6"></a>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- CTA + footer -->
    <section class="v5-closing v5-closing--center">
      <div class="v5-wrap">
        <div class="v5-closing-center">
          <h2 data-rv data-i18n="about.closing--center.h2"></h2>
          <p data-rv data-rvd="90" data-i18n="about.closing--center.p"></p>
          <div data-rv data-rvd="180" class="v5-closing-actions">
            <a href="contact.html" class="v5-btn v5-btn--accent v5-btn--lg" data-i18n="about.closing--center.btn"></a>
            <a href="product.html" class="v5-btn v5-btn--ghost v5-btn--lg" data-i18n="about.closing--center.btn-2"></a>
          </div>
        </div>
        <footer class="site-footer">
          <div class="footer-brand">
            <span class="footer-mark"></span>
            <span class="copyright" data-i18n="footer.copyright"></span>
          </div>
          <div class="footer-links">
            <a href="product.html" data-i18n="footer.a-product"></a>
            <a href="about.html" data-i18n="footer.a-about"></a>
            <a href="contact.html" data-i18n="footer.a-contact"></a>
            <a href="contact.html" data-i18n="footer.a-contact-2"></a>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="js/analytics.js" defer></script>
  <script src="js/main.js"></script>
</body>

</html>
