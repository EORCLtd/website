    <!-- Understanding uncertainty: what it is, why it matters, with a scenario tree -->
    <section class="v5-section v5-why">
      <div class="v5-center">
        <div data-rv class="v5-eyebrow" data-i18n="home.why.eyebrow"></div>
        <div data-rv data-rvd="60" class="v5-kicker" data-i18n="home.why.kicker"></div>
        <h2 data-rv data-rvd="120" class="v5-display" data-i18n="home.why.display"></h2>
      </div>

      <div class="v5-wrap v5-split">
        <div data-rv class="v5-copy">
          <p class="v5-lead" data-i18n="home.why.lead"></p>
          <p class="v5-lead v5-lead--strong" data-i18n="home.why.lead-2"></p>
        </div>

        <!-- Scenario tree: one decision today, many possible futures -->
        <figure data-rv data-rvd="100" class="v5-tree-card">
          <svg viewBox="0 0 600 290" role="img"
            aria-label="" data-i18n-attr="aria-label:home.why.svg.aria-label">
            <g class="v5-edges">
              <path d="M50 145 C150 145 150 85 250 85"></path>
              <path d="M50 145 C150 145 150 205 250 205"></path>
              <path d="M250 85 C330 85 330 45 420 45"></path>
              <path d="M250 85 C330 85 330 115 420 115"></path>
              <path d="M250 205 C330 205 330 175 420 175"></path>
              <path d="M250 205 C330 205 330 245 420 245"></path>
            </g>
            <path class="v5-forecast" d="M50 145 H420"></path>
            <g class="v5-nodes">
              <circle cx="250" cy="85" r="6"></circle>
              <circle cx="250" cy="205" r="6"></circle>
              <circle cx="420" cy="45" r="6"></circle>
              <circle cx="420" cy="115" r="6"></circle>
              <circle cx="420" cy="175" r="6"></circle>
              <circle cx="420" cy="245" r="6"></circle>
            </g>
            <circle class="v5-today" cx="50" cy="145" r="9"></circle>
            <circle class="v5-forecast-end" cx="250" cy="145" r="6"></circle>
            <circle class="v5-forecast-end" cx="420" cy="145" r="6"></circle>
            <g class="v5-labels">
              <text x="28" y="180" data-i18n="home.why.text"></text>
              <text x="436" y="50" data-i18n="home.why.text-2"></text>
              <text x="436" y="120" data-i18n="home.why.text-3"></text>
              <text x="436" y="180" data-i18n="home.why.text-4"></text>
              <text x="436" y="250" data-i18n="home.why.text-5"></text>
              <text class="v5-forecast-label" x="436" y="150" data-i18n="home.why.forecast-label"></text>
            </g>
          </svg>
          <figcaption class="v5-key">
            <span><i class="v5-key-line"></i><i18n-t data-i18n="home.why.span"></i18n-t></span>
            <span><i class="v5-key-line v5-key-line--forecast"></i><i18n-t data-i18n="home.why.span-2"></i18n-t></span>
          </figcaption>
        </figure>
