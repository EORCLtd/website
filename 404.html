<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="notfound.meta.title"></title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any unknown path, at any depth, so relative
     paths cannot be resolved against the request URL. They resolve against this
     <base> instead: the site root on the custom domain, /<repo>/ on a project page.
     The script must stay above every element below that uses a relative URL. -->
  <base href="/">
  <script>
    if (location.hostname.endsWith('.github.io')) {
      document.querySelector('base').href = '/' + location.pathname.split('/')[1] + '/';
    }
  </script>
  <link rel="icon" href="img/cropped-EORC_logo_letter-270x270.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v5.css">
  <script src="js/i18n.js"></script>
</head>

<body class="v5">

  <div class="v5-404">
    <!-- TODO photo: optional background, full-bleed -->
    <div class="v5-photo" aria-hidden="true"></div>
    <div class="v5-404-shade" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="nav">
        <a href="./" class="brand">
          <span class="brand-mark"></span>
          <i18n-t data-i18n="nav.brand"></i18n-t>
        </a>
        <span class="nav-spacer"></span>
        <button class="nav-toggle" aria-label="" aria-expanded="false" data-i18n-attr="aria-label:nav.nav-toggle.aria-label">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
          <li><a href="product.html" data-i18n="nav.a-product"></a></li>
          <li><a href="about.html" data-i18n="nav.a-about"></a></li>
          <li><a href="contact.html" data-i18n="nav.a-contact"></a></li>
          <li><a href="contact.html" class="nav-cta" data-i18n="nav.nav-cta"></a></li>
        </ul>
      </nav>
    </header>

    <main class="v5-404-main">
      <div class="v5-404-inner">
        <div class="v5-hero-eyebrow" data-i18n="notfound.main.hero-eyebrow"></div>
        <h1 data-i18n="notfound.main.h1"></h1>
        <p data-i18n="notfound.main.p"></p>
        <div class="v5-404-actions">
          <a href="./" class="v5-btn v5-btn--accent v5-btn--lg" data-i18n="notfound.main.btn"></a>
          <a href="contact.html" class="v5-btn v5-btn--ghost v5-btn--lg" data-i18n="notfound.main.btn-2"></a>
        </div>
      </div>
    </main>

    <div class="v5-404-foot">
      <footer class="site-footer">
        <div class="footer-brand">
          <span class="footer-mark"></span>
          <span class="copyright" data-i18n="footer.copyright"></span>
        </div>
        <div class="footer-links">
          <a href="product.html" data-i18n="footer.a-product"></a>
          <a href="about.html" data-i18n="footer.a-about"></a>
          <a href="contact.html" data-i18n="footer.a-contact"></a>
        </div>
      </footer>
    </div>
  </div>

  <script src="js/analytics.js" defer></script>
  <script src="js/main.js"></script>
</body>

</html>
