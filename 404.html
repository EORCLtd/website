<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — EORC</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any unknown path, at any depth, so relative
     paths cannot be resolved against the request URL. They resolve against this
     <base> instead: the site root on the custom domain, /<repo>/ on a project page.
     The script must stay above every element below that uses a relative URL. -->
  <base href="/">
  <script>
    if (location.hostname.endsWith('.github.io')) {
      document.querySelector('base').href = '/' + location.pathname.split('/')[1] + '/';
    }
  </script>
  <link rel="icon" href="img/cropped-EORC_logo_letter-270x270.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v5.css">
</head>
